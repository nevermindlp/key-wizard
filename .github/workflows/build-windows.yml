name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "key_wizard/**"
      - "requirements.txt"
      - "packaging/**"
      - "tests/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.11,<7"

      - name: Test
        run: python -m pytest

      - name: Check tkinter
        run: python -c "import tkinter"

      - name: Build KeyWizard.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --noupx
          --name KeyWizard
          --manifest packaging/key-wizard.manifest
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          --hidden-import pynput._util.win32
          main.py

      - uses: actions/upload-artifact@v4
        with:
          name: KeyWizard-windows
          path: dist/KeyWizard.exe
          if-no-files-found: error

      - name: Publish KeyWizard.exe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete windows --yes --cleanup-tag || true
          gh release create windows dist/KeyWizard.exe \
            --target "${GITHUB_SHA}" \
            --title "KeyWizard Windows" \
            --notes-file packaging/release-notes.txt \
            --latest
